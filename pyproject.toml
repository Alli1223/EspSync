[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espsync"
version = "0.4.0"
description = "Low-latency screen-to-light sync (ambilight) for ESPHome lights, with spatial room layout and HDR support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alastair Rayner" }]
dependencies = [
    "aioesphomeapi>=30",
    "zeroconf>=0.130",
    "numpy>=1.26",
    "mss>=9",
    "platformdirs>=4",
    # AES-GCM for the Hue Entertainment DTLS stream (also needed by aioesphomeapi).
    "cryptography>=42",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# python-mbedtls is only used by tests, as a reference DTLS server (wheels up to CPython 3.12).
dev = ["pytest>=8", "PySide6>=6.6", "python-mbedtls>=2.9; python_version < '3.13'"]

[project.scripts]
espsync-cli = "espsync.cli:main"

[project.gui-scripts]
espsync = "espsync.gui.app:main"

[tool.setuptools.packages.find]
include = ["espsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
