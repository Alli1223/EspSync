[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espsync"
version = "0.1.1"
description = "Low-latency screen-to-light sync (ambilight) for ESPHome lights, with spatial room layout and HDR support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alastair Rayner" }]
dependencies = [
    "aioesphomeapi>=30",
    "zeroconf>=0.130",
    "numpy>=1.26",
    "mss>=9",
    "platformdirs>=4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# Linux Wayland capture (xdg-desktop-portal + PipeWire). Also needs GStreamer's
# PipeWire plugin from the distro; see README "Platform notes".
wayland = ["jeepney>=0.8", "PyGObject>=3.42"]
dev = ["pytest>=8", "PySide6>=6.6", "jeepney>=0.8"]

[project.scripts]
espsync-cli = "espsync.cli:main"

[project.gui-scripts]
espsync = "espsync.gui.app:main"

[tool.setuptools.packages.find]
include = ["espsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
