name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt and X11 libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 xvfb
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: X11 capture smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m espsync bench --backend mss --seconds 1 --regions 50

  wayland-smoke:
    # Real xdg-desktop-portal + PipeWire on a headless Sway session: covers the
    # portal D-Bus handshake and PipeWire -> GStreamer frames (not GNOME/KDE).
    # Arch rather than Ubuntu 24.04: its xdg-desktop-portal-wlr 0.7.1 can't
    # cast without a GPU (see scripts/wayland-smoke.sh).
    runs-on: ubuntu-latest
    container: archlinux:latest
    # New and not yet seen green on GitHub; make it blocking once it is.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Wayland, portal and PipeWire packages
        run: >-
          pacman -Syu --noconfirm --needed
          sway swaybg xdg-desktop-portal xdg-desktop-portal-wlr pipewire wireplumber dbus fuse3
          gstreamer gst-plugins-base gst-plugins-bad gst-plugin-pipewire
          python python-gobject python-numpy python-platformdirs python-jeepney
      - name: Unprivileged user (sway won't run as root)
        run: useradd -m tester && chown -R tester "$GITHUB_WORKSPACE"
      - name: Portal capture smoke test (headless Sway)
        run: runuser -u tester -- env SHOW_LOGS=1 bash scripts/wayland-smoke.sh
